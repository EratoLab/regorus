# SQL code generation tests for membership operations

cases:
  - note: simple-membership
    rego: |
      package test

      privileged_users contains result if {
          some user in data.users
          user.role in {"admin", "manager"}
          result := {
              "name": user.name,
              "role": user.role
          }
      }
    expected_sql: |
      SELECT name, role
      FROM users
      WHERE role IN ('admin', 'manager')

  - note: membership-with-additional-conditions
    rego: |
      package test

      engineering_staff contains result if {
          some employee in data.employees
          employee.role in {"admin", "user", "guest"}
          employee.department == "engineering"
          result := {
              "name": employee.name,
              "role": employee.role,
              "department": employee.department
          }
      }
    expected_sql: |
      SELECT name, role, department
      FROM employees
      WHERE role IN ('admin', 'user', 'guest') AND department = 'engineering'

  - note: membership-with-condition
    rego: |
      package test

      active_privileged_users contains result if {
          some user in data.users
          user.role in {"admin", "manager"}
          user.active == true
          result := {
              "name": user.name,
              "role": user.role,
              "active": user.active
          }
      }
    expected_sql: |
      SELECT name, role, active
      FROM users
      WHERE role IN ('admin', 'manager') AND active = TRUE

  - note: multiple-membership-checks
    rego: |
      package test

      key_personnel contains result if {
          some employee in data.employees
          employee.role in {"admin", "manager"}
          employee.department in {"engineering", "security"}
          result := {
              "name": employee.name,
              "role": employee.role,
              "department": employee.department
          }
      }
    expected_sql: |
      SELECT name, role, department
      FROM employees
      WHERE role IN ('admin', 'manager') AND department IN ('engineering', 'security')

  - note: membership-with-numbers
    rego: |
      package test

      junior_users contains result if {
          some user in data.users
          user.level in {1, 2, 3}
          result := {
              "name": user.name,
              "level": user.level
          }
      }
    expected_sql: |
      SELECT name, level
      FROM users
      WHERE level IN (1, 2, 3)

  - note: membership-mixed-types
    rego: |
      package test

      filtered_resources contains result if {
          some resource in data.resources
          resource.type in {"public", "private"}
          resource.priority in {1, 2}
          result := {
              "id": resource.id,
              "type": resource.type,
              "priority": resource.priority
          }
      }
    expected_sql: |
      SELECT id, type, priority
      FROM resources
      WHERE type IN ('public', 'private') AND priority IN (1, 2)

  - note: membership-with-mixed-types
    rego: |
      package test

      active_events contains result if {
          some event in data.events
          event.status in {"active", "pending"}
          event.priority in {1, 2}
          result := {
              "id": event.id,
              "status": event.status,
              "priority": event.priority
          }
      }
    expected_sql: |
      SELECT id, status, priority
      FROM events
      WHERE status IN ('active', 'pending') AND priority IN (1, 2)

  - note: nested-field-membership
    rego: |
      package test

      authorized_users contains result if {
          some user in data.users
          user.permissions.role in {"read", "write", "admin"}
          result := {
              "name": user.name,
              "permission_role": user.permissions.role
          }
      }
    expected_sql: |
      SELECT name, permissions->>'role' AS permission_role
      FROM users
      WHERE permissions->>'role' IN ('read', 'write', 'admin')