# SQL code generation tests for Rego builtin functions

cases:
  - note: string-contains-function
    rego: |
      package test

      email_users contains result if {
          some user in data.users
          contains(user.email, "@company.com")
          result := {
              "name": user.name,
              "email": user.email
          }
      }
    expected_sql: |
      SELECT name, email
      FROM users
      WHERE email LIKE '%@company.com%'

  - note: string-startswith-function
    rego: |
      package test

      admin_users contains result if {
          some user in data.users
          startswith(user.username, "admin_")
          result := {
              "username": user.username,
              "role": user.role
          }
      }
    expected_sql: |
      SELECT username, role
      FROM users
      WHERE username LIKE 'admin_%'

  - note: string-endswith-function
    rego: |
      package test

      temp_files contains result if {
          some file in data.files
          endswith(file.name, ".tmp")
          result := {
              "name": file.name,
              "size": file.size
          }
      }
    expected_sql: |
      SELECT name, size
      FROM files
      WHERE name LIKE '%.tmp'

  - note: math-abs-function
    rego: |
      package test

      significant_changes contains result if {
          some change in data.changes
          abs(change.value) > 10
          result := {
              "name": change.name,
              "value": change.value
          }
      }
    expected_sql: |
      SELECT name, value
      FROM changes
      WHERE ABS(value) > 10

  - note: math-floor-function
    rego: |
      package test

      rounded_scores contains result if {
          some score in data.scores
          floor(score.value) >= 85
          result := {
              "student": score.student,
              "value": score.value
          }
      }
    expected_sql: |
      SELECT student, value
      FROM scores
      WHERE FLOOR(value) >= 85

  - note: string-lower-function
    rego: |
      package test

      normalized_users contains result if {
          some user in data.users
          lower(user.role) == "admin"
          result := {
              "name": user.name,
              "role": user.role
          }
      }
    expected_sql: |
      SELECT name, role
      FROM users
      WHERE LOWER(role) = 'admin'

  - note: string-upper-function
    rego: |
      package test

      shouting_messages contains result if {
          some msg in data.messages
          upper(msg.text) == msg.text
          result := {
              "id": msg.id,
              "text": msg.text
          }
      }
    expected_sql: |
      SELECT id, text
      FROM messages
      WHERE UPPER(text) = text

  - note: type-checking-is-string
    rego: |
      package test

      string_fields contains result if {
          some field in data.fields
          is_string(field.value)
          result := {
              "name": field.name,
              "value": field.value
          }
      }
    expected_sql: |
      SELECT name, value
      FROM fields
      WHERE TYPEOF(value) = 'text'

  - note: type-checking-is-number
    rego: |
      package test

      numeric_fields contains result if {
          some field in data.fields
          is_number(field.value)
          result := {
              "name": field.name,
              "value": field.value
          }
      }
    expected_sql: |
      SELECT name, value
      FROM fields
      WHERE (TYPEOF(value) = 'integer' OR TYPEOF(value) = 'real')

  - note: string-replace-function
    rego: |
      package test

      sanitized_names contains result if {
          some user in data.users
          result := {
              "sanitized_name": replace(user.name, " ", "_"),
              "role": user.role
          }
      }
    expected_sql: |
      SELECT REPLACE(name, ' ', '_') AS sanitized_name, role
      FROM users

  - note: math-ceiling-function
    rego: |
      package test

      rounded_up_scores contains result if {
          some score in data.scores
          ceil(score.value) > 90
          result := {
              "student": score.student,
              "value": score.value
          }
      }
    expected_sql: |
      SELECT student, value
      FROM scores
      WHERE CEIL(value) > 90

  - note: combined-builtin-functions
    rego: |
      package test

      processed_users contains result if {
          some user in data.users
          contains(lower(user.email), "@company.com")
          abs(user.score) >= 50
          result := {
              "name": user.name,
              "email": user.email,
              "score": user.score
          }
      }
    expected_sql: |
      SELECT name, email, score
      FROM users
      WHERE LOWER(email) LIKE '%@company.com%' AND ABS(score) >= 50

  - note: nested-function-calls
    rego: |
      package test

      formatted_users contains result if {
          some user in data.users
          startswith(upper(user.role), "ADMIN")
          result := {
              "name": user.name,
              "role": user.role
          }
      }
    expected_sql: |
      SELECT name, role
      FROM users
      WHERE UPPER(role) LIKE 'ADMIN%'