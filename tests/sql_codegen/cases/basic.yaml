# Basic SQL code generation tests for simple rules

cases:
  - note: simple-allow-rule
    rego: |
      package authz

      allowed_users contains result if {
          some user in data.users
          user.role == "admin"
          user.active == true
          result := {
              "role": user.role,
              "active": user.active
          }
      }
    expected_sql: |
      SELECT role, active
      FROM users
      WHERE role = 'admin' AND active = TRUE

  - note: single-condition
    rego: |
      package test

      security_employees contains result if {
          some employee in data.employees
          employee.department == "security"
          result := {
              "department": employee.department
          }
      }
    expected_sql: |
      SELECT department
      FROM employees
      WHERE department = 'security'

  - note: numeric-comparison
    rego: |
      package test

      eligible_users contains result if {
          some user in data.users
          user.age >= 18
          user.score > 85
          result := {
              "age": user.age,
              "score": user.score
          }
      }
    expected_sql: |
      SELECT age, score
      FROM users
      WHERE age >= 18 AND score > 85

  - note: string-literal-with-quotes
    rego: |
      package test

      target_users contains result if {
          some user in data.users
          user.name == "John \"Doe\""
          result := { "user_name": user.name }
      }
    expected_sql: |
      SELECT name AS user_name
      FROM users
      WHERE name = 'John "Doe"'

  - note: simple-condition
    rego: |
      package test

      admin_users contains result if {
          some user in data.users
          user.role == "admin"
          result := { "role": user.role }
      }
    expected_sql: |
      SELECT role
      FROM users
      WHERE role = 'admin'

  - note: multiple-conditions
    rego: |
      package test

      active_admins contains result if {
          some user in data.users
          user.role == "admin"
          user.active == true
          result := {
              "role": user.role,
              "active": user.active
          }
      }
    expected_sql: |
      SELECT role, active
      FROM users
      WHERE role = 'admin' AND active = TRUE

  - note: comparison-operators
    rego: |
      package test

      qualified_users contains result if {
          some user in data.users
          user.age >= 18
          user.score < 100
          result := {
              "age": user.age,
              "score": user.score
          }
      }
    expected_sql: |
      SELECT age, score
      FROM users
      WHERE age >= 18 AND score < 100

  - note: string-comparison
    rego: |
      package test

      filtered_employees contains result if {
          some employee in data.employees
          employee.name == "alice"
          employee.department != "finance"
          result := {
              "name": employee.name,
              "department": employee.department
          }
      }
    expected_sql: |
      SELECT name, department
      FROM employees
      WHERE name = 'alice' AND department != 'finance'

  - note: boolean-conditions
    rego: |
      package test

      valid_accounts contains result if {
          some account in data.accounts
          account.verified == true
          account.suspended == false
          result := {
              "verified": account.verified,
              "suspended": account.suspended
          }
      }
    expected_sql: |
      SELECT verified, suspended
      FROM accounts
      WHERE verified = TRUE AND suspended = FALSE

  - note: numeric-comparisons
    rego: |
      package test

      high_value_resources contains result if {
          some resource in data.resources
          resource.priority > 5
          resource.cost <= 1000.50
          result := {
              "priority": resource.priority,
              "cost": resource.cost
          }
      }
    expected_sql: |
      SELECT priority, cost
      FROM resources
      WHERE priority > 5 AND cost <= 1000.5

  - note: null-comparison
    rego: |
      package test

      active_users contains result if {
          some user in data.users
          user.deleted_at == null
          result := {
              "deleted_at": user.deleted_at
          }
      }
    expected_sql: |
      SELECT deleted_at
      FROM users
      WHERE deleted_at IS NULL